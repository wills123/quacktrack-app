# One "color" of the release stack (blue or green), built from immutable
# images. Each color runs as its own compose project so both can be up at
# once, and joins quacktrack-public-net under a fixed alias
# (quacktrack-<color>-web) so the router (docker-compose.router.yml) can
# reach whichever one it is pointed at:
#
#   TAG=v2.1.0 COMMIT=$(git rev-parse --short HEAD) COLOR=blue \
#     docker compose -p quacktrack-blue -f docker-compose.release.yml up -d --build
#
# Neither service publishes a host port: the router is the only public
# entry point. For a one-off manual check of a color before it takes
# traffic, curl its container IP directly (scripts/release.sh does this
# for the automated health check) or `docker exec` into it.
#
# The database is NOT part of this file: it lives in the long-running
# `quacktrack` project and is reached over the external quacktrack-db-net
# network (alias quacktrack-db). Sessions live in the shared quacktrack_sessions
# volume so users stay logged in when traffic moves between colors; create it
# once with: docker volume create quacktrack_sessions
# The application's settings, passed to the PHP container only (audit H1). Nothing else gets them, and the PHP
# container gets no MySQL root password. Add a new application setting here and to .env.example.
x-php-app-env: &php-app-env
  APP_ENV: ${APP_ENV:-}
  APP_URL: ${APP_URL:-}
  APP_NAME: ${APP_NAME:-}
  APP_SECRET: ${APP_SECRET:-}
  APP_SECRET_PREVIOUS: ${APP_SECRET_PREVIOUS:-}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
  SESSION_TIMEOUT: ${SESSION_TIMEOUT:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  PURCHASING_EMAIL: ${PURCHASING_EMAIL:-}
  FROM_EMAIL: ${FROM_EMAIL:-}
  FROM_NAME: ${FROM_NAME:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  DB_ALLOW_PLAINTEXT: ${DB_ALLOW_PLAINTEXT:-}
  MAX_ORDER_QUANTITY: ${MAX_ORDER_QUANTITY:-}
  CHECKOUT_VALIDATION_ENABLED: ${CHECKOUT_VALIDATION_ENABLED:-}
  CHECKOUT_LOCK_WAIT: ${CHECKOUT_LOCK_WAIT:-}
  CHECKOUT_RATE_LIMIT_MAX: ${CHECKOUT_RATE_LIMIT_MAX:-}
  CHECKOUT_STATE_DIR: ${CHECKOUT_STATE_DIR:-}
  API_KEY_RATE_LIMIT_PER_MINUTE: ${API_KEY_RATE_LIMIT_PER_MINUTE:-}
  REGION_STORAGE_MAX_ADJUST_DELTA: ${REGION_STORAGE_MAX_ADJUST_DELTA:-}
  MIGRATIONS_DIR: ${MIGRATIONS_DIR:-}
  PRODUCT_UPLOAD_DIR: ${PRODUCT_UPLOAD_DIR:-}
  SURVEY_UPLOAD_DIR: ${SURVEY_UPLOAD_DIR:-}
  TRAVEL_UPLOAD_DIR: ${TRAVEL_UPLOAD_DIR:-}
  TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  REGISTER_LEFT_IMAGE: ${REGISTER_LEFT_IMAGE:-}
  REGISTER_RIGHT_IMAGE: ${REGISTER_RIGHT_IMAGE:-}
  LOGIN_LEFT_IMAGE: ${LOGIN_LEFT_IMAGE:-}
  LOGIN_RIGHT_IMAGE: ${LOGIN_RIGHT_IMAGE:-}
  LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-}
  PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-}
  AUTH_LOGIN_ACCOUNT_LIMIT: ${AUTH_LOGIN_ACCOUNT_LIMIT:-}
  AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT:-}
  AUTH_RECOVERY_ACCOUNT_LIMIT: ${AUTH_RECOVERY_ACCOUNT_LIMIT:-}
  AUTH_RECOVERY_IP_LIMIT: ${AUTH_RECOVERY_IP_LIMIT:-}
  SSO_ENABLED: ${SSO_ENABLED:-}
  SSO_REQUIRED: ${SSO_REQUIRED:-}
  SSO_DISPLAY_NAME: ${SSO_DISPLAY_NAME:-}
  SSO_ISSUER_URL: ${SSO_ISSUER_URL:-}
  SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
  SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
  SSO_CALLBACK_URL: ${SSO_CALLBACK_URL:-}
  SSO_SESSION_MAX_AGE: ${SSO_SESSION_MAX_AGE:-}
  SNIPE_IT_ENABLED: ${SNIPE_IT_ENABLED:-}
  SNIPE_IT_API_URL: ${SNIPE_IT_API_URL:-}
  SNIPE_IT_API_KEY: ${SNIPE_IT_API_KEY:-}
  SNIPE_IT_API_TIMEOUT: ${SNIPE_IT_API_TIMEOUT:-}
  SNIPE_IT_CACHE_TTL: ${SNIPE_IT_CACHE_TTL:-}
  SNIPE_IT_ALLOW_INSECURE_HTTP: ${SNIPE_IT_ALLOW_INSECURE_HTTP:-}
  SNIPE_TOKEN_MAX_AGE: ${SNIPE_TOKEN_MAX_AGE:-}
  SNIPE_SYNC_LOG_RETENTION_DAYS: ${SNIPE_SYNC_LOG_RETENTION_DAYS:-}
  SNIPE_IT_OAUTH_ENABLED: ${SNIPE_IT_OAUTH_ENABLED:-}
  SNIPE_IT_OAUTH_CLIENT_ID: ${SNIPE_IT_OAUTH_CLIENT_ID:-}
  SNIPE_IT_OAUTH_CLIENT_SECRET: ${SNIPE_IT_OAUTH_CLIENT_SECRET:-}
  SNIPE_IT_OAUTH_REDIRECT_URI: ${SNIPE_IT_OAUTH_REDIRECT_URI:-}
  SNIPE_IT_OAUTH_BASE_URL: ${SNIPE_IT_OAUTH_BASE_URL:-}
  SNIPE_IT_SSO_AUTO_PROVISION: ${SNIPE_IT_SSO_AUTO_PROVISION:-}
  ACUMATICA_ENABLED: ${ACUMATICA_ENABLED:-}
  ACUMATICA_API_URL: ${ACUMATICA_API_URL:-}
  ACUMATICA_ALLOW_INSECURE_HTTP: ${ACUMATICA_ALLOW_INSECURE_HTTP:-}
  ACUMATICA_ENDPOINT_NAME: ${ACUMATICA_ENDPOINT_NAME:-}
  ACUMATICA_API_VERSION: ${ACUMATICA_API_VERSION:-}
  ACUMATICA_USERNAME: ${ACUMATICA_USERNAME:-}
  ACUMATICA_PASSWORD: ${ACUMATICA_PASSWORD:-}
  ACUMATICA_COMPANY: ${ACUMATICA_COMPANY:-}
  ACUMATICA_BRANCH: ${ACUMATICA_BRANCH:-}
  ACUMATICA_API_TIMEOUT: ${ACUMATICA_API_TIMEOUT:-}
  ACUMATICA_CACHE_TTL: ${ACUMATICA_CACHE_TTL:-}
  QUICKQUEUE_API_BASE_URL: ${QUICKQUEUE_API_BASE_URL:-}
  QUICKQUEUE_ALLOW_INSECURE_HTTP: ${QUICKQUEUE_ALLOW_INSECURE_HTTP:-}
  QUICKQUEUE_API_TOKEN: ${QUICKQUEUE_API_TOKEN:-}
  QUICKQUEUE_API_TIMEOUT: ${QUICKQUEUE_API_TIMEOUT:-}
  CLIENT_ERROR_API_KEY: ${CLIENT_ERROR_API_KEY:-}
  CLIENT_ERROR_RATE_LIMIT_MAX: ${CLIENT_ERROR_RATE_LIMIT_MAX:-}
  CLIENT_ERROR_RATE_LIMIT_DIR: ${CLIENT_ERROR_RATE_LIMIT_DIR:-}

services:
  quacktrack-php:
    image: quacktrack/php:${TAG:?set TAG to the release tag, e.g. v2.1.0}
    container_name: quacktrack-${COLOR:?set COLOR to blue or green}-php
    build:
      context: .
      dockerfile: php/Dockerfile.release
      args:
        VERSION: ${TAG}
        COMMIT: ${COMMIT:-unknown}
    restart: unless-stopped
    environment:
      <<: *php-app-env
      PHP_MEMORY_LIMIT: 256M
      UPLOAD_MAX_FILESIZE: 100M
      POST_MAX_SIZE: 100M
      DB_HOST: quacktrack-db
      DB_NAME: parts_shop
      DB_USER: parts_user
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_SSL_CA: /etc/quacktrack/db-ca/ca.pem
    volumes:
      - quacktrack_sessions:/var/www/sessions
      - quacktrack_db_ca:/etc/quacktrack/db-ca:ro
      - ${QT_UPLOADS_DIR:-./uploads}:/var/www/uploads
      - ${QT_LOGS_DIR:-./logs}:/var/www/logs
    networks:
      default: {}
      quacktrack-db-net: {}
      quacktrack-public-net:
        aliases:
          - quacktrack-${COLOR}-php

  quacktrack-web:
    image: quacktrack/web:${TAG}
    container_name: quacktrack-${COLOR}-web
    build:
      context: .
      dockerfile: nginx/Dockerfile.release
    restart: unless-stopped
    volumes:
      - ${QT_UPLOADS_DIR:-./uploads}:/var/www/html/uploads:ro
      # Deployment-specific proxy addresses (nginx/trusted-proxies/README.md)
      - ${QT_TRUSTED_PROXIES_DIR:-/etc/quacktrack/trusted-proxies}:/etc/nginx/trusted-proxies:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - quacktrack-php
    networks:
      default: {}
      quacktrack-public-net:
        aliases:
          - quacktrack-${COLOR}-web

volumes:
  quacktrack_sessions:
    external: true
  # Public CA certificate, created by the shared stack's quacktrack-db-certs service
  quacktrack_db_ca:
    external: true

networks:
  quacktrack-db-net:
    external: true
  quacktrack-public-net:
    external: true
