  CLIENT_ERROR_RATE_LIMIT_DIR: ${CLIENT_ERROR_RATE_LIMIT_DIR:-}


services:
  quacktrack-nginx:
    restart: unless-stopped
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    ports:
      - "${QT_BIND_ADDRESS:-127.0.0.1}:8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html:ro
      # The repository mount must not carry the secrets file into the container (audit H1).
      - /dev/null:/var/www/html/.env:ro
      - ./uploads:/var/www/uploads:ro
      # Deployment-specific proxy addresses (nginx/trusted-proxies/README.md)
      - ${QT_TRUSTED_PROXIES_DIR:-./nginx/trusted-proxies}:/etc/nginx/trusted-proxies:ro
    depends_on:
      - quacktrack-php
      - quacktrack-db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quacktrack-net
##      - shared-network

  quacktrack-php:
    restart: unless-stopped
    build:
      context: .
      dockerfile: php/Dockerfile
    environment:
      <<: *php-app-env
      PHP_MEMORY_LIMIT: 256M
      UPLOAD_MAX_FILESIZE: 100M
      POST_MAX_SIZE: 100M
      DB_HOST: quacktrack-db
      DB_NAME: parts_shop
      DB_USER: parts_user
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_SSL_CA: /etc/quacktrack/db-ca/ca.pem
    volumes:
      - ./:/var/www/html
      # Settings come from the allowlist above, not from the secrets file in the repository mount (audit H1).
      - /dev/null:/var/www/html/.env:ro
      - quacktrack_db_ca:/etc/quacktrack/db-ca:ro
      - quacktrack_vendor_data:/var/www/html/vendor
      - ./assets:/var/www/assets:ro
      - ./uploads:/var/www/uploads
      - ./logs:/var/www/logs
      - ./db/init:/var/www/html/db/init:ro
      - ./db/migrations:/var/www/html/db/migrations:ro
    depends_on:
      - quacktrack-db
    networks:
      - quacktrack-net
      - quacktrack-db-net

  # One-shot: creates the CA and the database's TLS certificate (see docker/mysql/init-certs.sh).
  quacktrack-db-certs:
    image: ${QT_MYSQL_IMAGE:-mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b}
    restart: "no"
    entrypoint: ["/bin/sh", "/init-certs.sh"]
    environment:
      DB_TLS_NAMES: ${DB_TLS_NAMES:-quacktrack-db db localhost}
    volumes:
      - ./docker/mysql/init-certs.sh:/init-certs.sh:ro
      - quacktrack_db_tls_ca:/ca-private
      - quacktrack_db_tls:/tls
      - quacktrack_db_ca:/ca

  quacktrack-db:
    restart: unless-stopped
    image: ${QT_MYSQL_IMAGE:-mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b}
    depends_on:
      quacktrack-db-certs:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # root may only log in from inside this container (backups, release.sh), never over the network
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: parts_shop
      MYSQL_USER: parts_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - quacktrack_db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/tls.cnf:/etc/mysql/conf.d/tls.cnf:ro
      - ${DB_REQUIRE_TLS_CNF:-./docker/mysql/require-tls.cnf}:/etc/mysql/conf.d/require-tls.cnf:ro
      - quacktrack_db_tls:/etc/mysql/tls:ro
    networks:
      - quacktrack-net
      - quacktrack-db-net

volumes:
  quacktrack_db_data:
    name: quacktrack_db_data
  # Database TLS material, one volume per audience (see docker/mysql/init-certs.sh)
  quacktrack_db_tls_ca:
    name: quacktrack_db_tls_ca
  quacktrack_db_tls:
    name: quacktrack_db_tls
  quacktrack_db_ca:
    name: quacktrack_db_ca
  quacktrack_vendor_data:

networks:
  quacktrack-net:
    driver: bridge
  quacktrack-db-net:
    name: quacktrack-db-net
##  shared-network:
##    external: true
