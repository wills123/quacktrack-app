  SURVEY_UPLOAD_DIR: ${SURVEY_UPLOAD_DIR:-}
  TRAVEL_UPLOAD_DIR: ${TRAVEL_UPLOAD_DIR:-}
  TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  REGISTER_LEFT_IMAGE: ${REGISTER_LEFT_IMAGE:-}
  REGISTER_RIGHT_IMAGE: ${REGISTER_RIGHT_IMAGE:-}
  LOGIN_LEFT_IMAGE: ${LOGIN_LEFT_IMAGE:-}
  LOGIN_RIGHT_IMAGE: ${LOGIN_RIGHT_IMAGE:-}
  LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-}
  PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-}
  AUTH_LOGIN_ACCOUNT_LIMIT: ${AUTH_LOGIN_ACCOUNT_LIMIT:-}
  AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT:-}
  AUTH_RECOVERY_ACCOUNT_LIMIT: ${AUTH_RECOVERY_ACCOUNT_LIMIT:-}
  AUTH_RECOVERY_IP_LIMIT: ${AUTH_RECOVERY_IP_LIMIT:-}
  SSO_ENABLED: ${SSO_ENABLED:-}
  SSO_REQUIRED: ${SSO_REQUIRED:-}
  SSO_DISPLAY_NAME: ${SSO_DISPLAY_NAME:-}
  SSO_ISSUER_URL: ${SSO_ISSUER_URL:-}
  SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
  SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
  SSO_CALLBACK_URL: ${SSO_CALLBACK_URL:-}
  SSO_SESSION_MAX_AGE: ${SSO_SESSION_MAX_AGE:-}
  SNIPE_IT_ENABLED: ${SNIPE_IT_ENABLED:-}
  SNIPE_IT_API_URL: ${SNIPE_IT_API_URL:-}
  SNIPE_IT_API_KEY: ${SNIPE_IT_API_KEY:-}
  SNIPE_IT_API_TIMEOUT: ${SNIPE_IT_API_TIMEOUT:-}
  SNIPE_IT_CACHE_TTL: ${SNIPE_IT_CACHE_TTL:-}
  SNIPE_IT_ALLOW_INSECURE_HTTP: ${SNIPE_IT_ALLOW_INSECURE_HTTP:-}
  SNIPE_TOKEN_MAX_AGE: ${SNIPE_TOKEN_MAX_AGE:-}
  SNIPE_SYNC_LOG_RETENTION_DAYS: ${SNIPE_SYNC_LOG_RETENTION_DAYS:-}
  SNIPE_IT_OAUTH_ENABLED: ${SNIPE_IT_OAUTH_ENABLED:-}
  SNIPE_IT_OAUTH_CLIENT_ID: ${SNIPE_IT_OAUTH_CLIENT_ID:-}
  SNIPE_IT_OAUTH_CLIENT_SECRET: ${SNIPE_IT_OAUTH_CLIENT_SECRET:-}
  SNIPE_IT_OAUTH_REDIRECT_URI: ${SNIPE_IT_OAUTH_REDIRECT_URI:-}
  SNIPE_IT_OAUTH_BASE_URL: ${SNIPE_IT_OAUTH_BASE_URL:-}
  SNIPE_IT_SSO_AUTO_PROVISION: ${SNIPE_IT_SSO_AUTO_PROVISION:-}
  ACUMATICA_ENABLED: ${ACUMATICA_ENABLED:-}
