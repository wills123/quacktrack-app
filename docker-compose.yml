  APP_URL: ${APP_URL:-}
  APP_NAME: ${APP_NAME:-}
  APP_SECRET: ${APP_SECRET:-}
  APP_SECRET_PREVIOUS: ${APP_SECRET_PREVIOUS:-}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
  SESSION_TIMEOUT: ${SESSION_TIMEOUT:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  PURCHASING_EMAIL: ${PURCHASING_EMAIL:-}
  FROM_EMAIL: ${FROM_EMAIL:-}
  FROM_NAME: ${FROM_NAME:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  DB_ALLOW_PLAINTEXT: ${DB_ALLOW_PLAINTEXT:-}
  MAX_ORDER_QUANTITY: ${MAX_ORDER_QUANTITY:-}
  CHECKOUT_VALIDATION_ENABLED: ${CHECKOUT_VALIDATION_ENABLED:-}
  CHECKOUT_LOCK_WAIT: ${CHECKOUT_LOCK_WAIT:-}
  CHECKOUT_RATE_LIMIT_MAX: ${CHECKOUT_RATE_LIMIT_MAX:-}
  CHECKOUT_STATE_DIR: ${CHECKOUT_STATE_DIR:-}
