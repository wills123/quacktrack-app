limit_req_zone $binary_remote_addr zone=webhook:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;


server {
    server_tokens off;

    # Traffic reaches this container via Cloudflare and the LAN proxies, so the
    # socket address is always a proxy. Trust only those and take the real client
    # from X-Forwarded-For; otherwise the per-IP rate limits below would be shared
    # by every user, and the app's logs would record the proxy instead of the client.
    set_real_ip_from 10.0.0.10;
    set_real_ip_from 10.0.0.11;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_status 429;

    fastcgi_hide_header X-Powered-By;
    listen 80;
    server_name localhost;
    client_max_body_size 50M;
    root /var/www/html/app;
    index index.php index.html;

    # Disable automatic redirects and directory indexing
    absolute_redirect off;
    server_name_in_redirect off;
    port_in_redirect off;
    merge_slashes off;
    autoindex off;

    # Let PHP handle trailing slash removal to prevent nginx redirect loops

    # Route error pages through PHP (router)
    error_page 403 /router.php?code=403;
    error_page 404 /router.php?code=404;
    error_page 500 502 503 504 /router.php?code=500;

    # Allow internal dispatch to router
    location = /router.php {
        internal;
        fastcgi_pass quacktrack-php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    
    
    resolver 127.0.0.11 valid=30s;

    # Include MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Add no-cache headers for PHP files
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
    expires 0;

    # Uploads directory - serve directly
    # User-supplied content, so nosniff matters here more than anywhere else:
    # it stops a browser from reinterpreting an upload as HTML/JS regardless
    # of the Content-Type nginx sends based on the file's extension.
    location /uploads/ {
        alias /var/www/html/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Assets directory - serve directly
    location /assets/ {
        alias /var/www/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Webhook endpoint - proxy to host machine with streaming support
    location /webhook/deploy {
        limit_req zone=webhook burst=5 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://host.docker.internal:9002/hooks/deploy-prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;

        # Disable buffering for real-time streaming output
        proxy_buffering off;
        proxy_cache off;

        # Allow long-running deployments (5 minutes)
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;

        # Chunked transfer for streaming
        chunked_transfer_encoding on;
    }
    # Rate-limit login endpoints
    location = /login {
        limit_req zone=login burst=10 nodelay;
        try_files $uri @router;
    }

    # IMPORTANT: do NOT serve login.php as a static file.
    # If try_files finds /app/login.php, nginx will return raw PHP source.
    # Always route through the PHP router.
    location = /login.php {
        limit_req zone=login burst=10 nodelay;

        fastcgi_pass quacktrack-php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/router.php;
    }



    # Main location - first try to serve static files, then route to PHP
    location / {
        # First, try to serve request as a file (for CSS, JS, images, etc.),
        # otherwise pass it to router.php.
        # Deliberately NOT "$uri/": the document root is app/, which has real
        # directories (app/admin/, app/api/, ...). With "$uri/", a request for
        # /admin matched app/admin/ as a directory, nginx redirected to /admin/
        # and answered 403 (no index file) - the router, which maps /admin to
        # the admin dashboard, never ran. Directory requests now reach the
        # router, which serves the page or a 404.
        #
        # A file served directly from here (e.g. the static index.html
        # stub, any stray .css/.js at the app root) bypasses PHP entirely,
        # so it never gets set_security_headers()'s headers either -- add
        # the one that matters for static content here too. Adding any
        # add_header in this block stops the server-level Cache-Control/
        # Pragma ones above from being inherited here, so they're repeated
        # rather than silently dropped for these responses.
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri @router;
    }

    # API location - pass PHP scripts to fastcgi (MUST come before general .php rule)
    location ~ ^/api/(.*\.php)$ {
        fastcgi_pass quacktrack-php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/$1;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
    }
    
    # Handle direct PHP file access - route through router for security
    # This MUST come after the API rule to avoid conflicts
    location ~ \.php$ {
        # Don't allow direct access to PHP files except router.php
        # Everything goes through the router
        fastcgi_pass quacktrack-php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/router.php;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
    }
    
    # Router location - all non-static requests go here
    location @router {
        fastcgi_pass quacktrack-php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/router.php;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
    }

    # Deny access to sensitive files
    location ~ /\.ht {
        deny all;
    }

    location ~ \.env {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    # Never serve backups, dependency manifests, lockfiles or docs from the web root
    location ~* (\.(bak|backup|old|orig|save|swp|sql|log|md|lock)$|\.bak[._-]|~$|^/composer\.json$) {
        deny all;
    }
}
