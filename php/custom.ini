upload_max_filesize = 500M
post_max_size = 500M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

; Keep diagnostics out of HTTP responses, including failures before config.php.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Unused upload-progress session callbacks run before application validation.
; Defense in depth; a patched PHP runtime is still required.
session.upload_progress.enabled = Off

; Native exception traces must not log credential arguments.
zend.exception_ignore_args = On
; The only PHP INI the images install (audit H13). Do not advertise the PHP version in responses.
; disable_functions is not set: Composer runs in the image with this file loaded and needs proc_open.
expose_php = Off
