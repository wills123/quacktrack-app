# Never log the raw request target or Referer: OAuth codes and reset tokens live in query strings.
log_format quacktrack_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

# The router is the ONE long-lived, public-facing entry point for the
# blue/green release pipeline. It never rebuilds on a release: only the
# included active-upstream.conf changes (a one-line `set`), so flipping
# traffic between colors is a config reload, not a restart, and the
# webhook endpoint it owns never goes down mid-deploy.
#
# active-upstream.conf is bind-mounted read-only from the host
# (see docker-compose.router.yml) and rewritten by scripts/release.sh.
# Its default, baked into the image, points at blue so the container is
# never left without a valid $upstream_web if the mount is briefly empty.

limit_req_zone $binary_remote_addr zone=router_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=router_webhook:10m rate=5r/m;

server {
    # Override the image's inherited raw access log rather than adding a second HTTP-level log.
    access_log /var/log/nginx/access.log quacktrack_safe;
    listen 80;
    server_name _;
    server_tokens off;

    # Container names are resolved via Docker's embedded DNS. A short TTL
    # keeps proxy_pass from caching a color's address past its lifetime.
    resolver 127.0.0.11 valid=10s;

    # The router sees Cloudflare/the LAN proxies, never the real client, so
    # rate limiting and logging need the address recovered from
    # X-Forwarded-For -- otherwise every visitor would share one limit.
    # The LAN proxies' addresses are deployment settings, not repository content (audit H10): one
    # `set_real_ip_from <address>;` per proxy in a *.conf file of this directory (nginx/trusted-proxies/README.md).
    include /etc/nginx/trusted-proxies/*.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_status 429;

    include /etc/nginx/state/active-upstream.conf;

    # Router's own liveness check -- independent of which color is active,
    # so monitoring can tell "router is up" apart from "the app is up".
    location = /router-health {
        access_log off;
        default_type application/json;
        return 200 '{"router":"ok"}';
    }

    location = /login {
        limit_req zone=router_login burst=10 nodelay;
        proxy_pass http://$upstream_web;
        include /etc/nginx/proxy_params.conf;
    }

    location = /login.php {
        limit_req zone=router_login burst=10 nodelay;
        proxy_pass http://$upstream_web;
        include /etc/nginx/proxy_params.conf;
    }

    # Deploys are triggered here, at the router, not inside a color -- a
    # release replacing a color must never be able to cut the connection
    # that is triggering it.
    location /webhook/deploy {
        limit_req zone=router_webhook burst=5 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://host.docker.internal:9002/hooks/deploy-prod;
        proxy_buffering off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
        include /etc/nginx/proxy_params.conf;
    }

    location ~* (\.(bak|backup|old|orig|save|swp|sql|log|md|lock)$|\.bak[._-]|~$|^/composer\.json$) {
        deny all;
    }

    location ~ /\.(ht|env|git) {
        deny all;
    }

    # Raw upstream errors would otherwise retain authorization codes and reset tokens.
    location ~ ^/(?:sso/(?:login|callback)|api/snipe-oauth-callback(?:\.php)?|reset[_-]password(?:\.php)?)/*$ {
        error_log /dev/null;
        proxy_pass http://$upstream_web;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        proxy_pass http://$upstream_web;
        include /etc/nginx/proxy_params.conf;
    }
}
