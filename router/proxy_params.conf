# Shared reverse-proxy headers for the router. One place to get this right
# instead of repeating it in every location block.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_set_header Connection "";
# No proxy_read_timeout here (nginx's 60s default applies): the webhook
# location sets its own 300s and, included together, nginx treats the same
# directive appearing twice in one location as a fatal duplicate -- it
# crash-loops the whole router, not just that one route.
